<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murkoff // Control Center (Admin)</title>
    <style>
        body {
            background-color: #050507;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .control-panel {
            width: 100%;
            max-width: 900px;
            background: #0c0c10;
            border: 2px solid #502099;
            box-shadow: 0 0 30px rgba(145, 70, 255, 0.3), inset 0 0 15px rgba(0, 0, 0, 0.8);
            border-radius: 12px;
            padding: 25px;
            box-sizing: border-box;
        }

        header {
            text-align: center;
            border-bottom: 1px dashed #502099;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            color: #bf94ff;
            margin: 0 0 5px 0;
            font-size: 1.4em;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header p {
            color: #707085;
            font-size: 0.8em;
            margin: 0;
        }

        /* Сетка панели управления */
        .grid-dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-dashboard {
                grid-template-columns: 1fr;
            }
        }

        .panel-module {
            background: #14141c;
            border: 1px solid #40197a;
            border-radius: 8px;
            padding: 15px;
            position: relative;
        }

        .panel-module h3 {
            color: #ff6666;
            margin-top: 0;
            font-size: 0.95em;
            text-transform: uppercase;
            border-bottom: 1px solid #301050;
            padding-bottom: 8px;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .panel-module.security h3 { color: #ff3333; }
        .panel-module.streams h3 { color: #00ff66; }

        /* Элементы управления (кнопки, тумблеры, ползунки) */
        .control-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 0.85em;
        }

        .control-row label {
            color: #b0b0c0;
        }

        /* Кастомный чекбокс-тумблер */
        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 22px;
        }

        .switch input { 
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #22222d;
            transition: .3s;
            border: 1px solid #502099;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 14px;
            width: 14px;
            left: 3px;
            bottom: 3px;
            background-color: #707085;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #502099;
            border-color: #9146FF;
        }

        input:checked + .slider:before {
            transform: translateX(22px);
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        /* Ползунки */
        input[type="range"] {
            width: 130px;
            accent-color: #9146FF;
            background: #08080a;
        }

        /* Поля ввода */
        textarea, input[type="password"], input[type="text"] {
            width: 100%;
            background: #08080a;
            border: 1px solid #502099;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        textarea {
            height: 75px;
            resize: none;
        }

        /* Кнопки */
        .btn-terminal {
            background: #181820;
            border: 1px solid #502099;
            color: #bf94ff;
            padding: 8px 12px;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.8em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            width: 100%;
        }

        .btn-terminal:hover {
            background: #9146FF;
            color: #fff;
            border-color: #9146FF;
            box-shadow: 0 0 10px rgba(145, 70, 255, 0.4);
        }

        .btn-danger {
            border-color: #7a1919;
            color: #ff6666;
        }
        .btn-danger:hover {
            background: #ff3333;
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.4);
        }

        /* Статус-лог */
        .terminal-log {
            grid-column: span 2;
            background: #08080a;
            border: 1px solid #301050;
            border-radius: 6px;
            padding: 10px 15px;
            font-size: 0.8em;
            color: #00ff66;
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        @media (max-width: 768px) {
            .terminal-log { grid-column: span 1; }
        }
    </style>
</head>
<body>

    <div class="control-panel">
        <header>
            <h1>🔒 Терминал Управления Системой</h1>
            <p>Уровень доступа: Администратор (PashaShine)</p>
        </header>

        <div class="grid-dashboard">

            <!-- Модуль 1: Управление расписанием и текстом -->
            <div class="panel-module">
                <h3>📅 Редактор вещания</h3>
                <div class="control-row">
                    <label>Секретный ключ:</label>
                </div>
                <input type="password" id="admin-pass" placeholder="Введите ключ доступа...">
                
                <div class="control-row">
                    <label>Текст расписания / Статуса:</label>
                </div>
                <textarea id="schedule-text" placeholder="Например: Пятница 19:00 — Outlast Trials"></textarea>
                
                <button class="btn-terminal" onclick="saveData()">💾 Загрузить в сеть</button>
            </div>

            <!-- Модуль 2: Системные тумблеры и рычаги -->
            <div class="panel-module streams">
                <h3>⚡ Параметры хаба</h3>
                
                <div class="control-row">
                    <label>Авто-проверка Twitch:</label>
                    <label class="switch">
                        <input type="checkbox" checked onchange="logAction('Авто-проверка Twitch изменена')">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-row">
                    <label>Эффект помех на сайте:</label>
                    <label class="switch">
                        <input type="checkbox" onchange="logAction('Режим помех переключен')">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-row">
                    <label>Музыкальный эмбиент:</label>
                    <label class="switch" checked>
                        <input type="checkbox" checked onchange="logAction('Статус аудио-шлюза изменен')">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="control-row" style="margin-top: 15px;">
                    <label>Уровень напряжения (Шок):</label>
                    <input type="range" min="0" max="100" value="25" oninput="logAction('Напряжение сети: ' + this.value + '%')">
                </div>
            </div>

            <!-- Модуль 3: Протоколы безопасности -->
            <div class="panel-module security">
                <h3>🚨 Протоколы изолятора</h3>
                
                <div class="control-row" style="margin-bottom: 15px;">
                    <button class="btn-terminal btn-danger" onclick="logAction('⚠ ВНИМАНИЕ: Активирован протокол тревоги!')">🚨 ОБЩАЯ ТРЕВОГА</button>
                </div>
                <div class="control-row" style="margin-bottom: 15px;">
                    <button class="btn-terminal" onclick="logAction('🔄 Кэш сайта успешно сброшен.')">🧹 ОЧИСТИТЬ КЭШ СЕКТОРОВ</button>
                </div>
                <div class="control-row">
                    <button class="btn-terminal" onclick="logAction('🔒 Сессия администратора заблокирована.')">🔒 ЗАБЛОКИРОВАТЬ ПУЛЬТ</button>
                </div>
            </div>

            <!-- Модуль 4: Быстрые ссылки -->
            <div class="panel-module">
                <h3>🔗 Быстрые действия</h3>
                <div class="control-row" style="margin-bottom: 12px;">
                    <button class="btn-terminal" onclick="logAction('📋 Список логов выгружен в буфер.')">СКАЧАТЬ ЛОГИ СИСТЕМЫ</button>
                </div>
                <div class="control-row" style="margin-bottom: 12px;">
                    <button class="btn-terminal" onclick="logAction('👁 Режим скрытого наблюдения активен.')">СКРЫТЬ СТАТУС ОНЛАЙН</button>
                </div>
                <div class="control-row">
                    <button class="btn-terminal" onclick="window.location.href='index.html'">◀ НА ГЛАВНУЮ ХАБА</button>
                </div>
            </div>

            <!-- Лог терминала снизу -->
            <div class="terminal-log" id="terminal-log">
                > Системный терминал инициализирован. Ожидание команд...
            </div>

        </div>
    </div>

    <script>
        function logAction(text) {
            const logBox = document.getElementById('terminal-log');
            const time = new Date().toLocaleTimeString();
            logBox.innerText = `[${time}] > ${text}`;
        }

        function saveData() {
            const pass = document.getElementById('admin-pass').value;
            const text = document.getElementById('schedule-text').value;

            if (!pass) {
                logAction('❌ ОШИБКА: Не введен секретный ключ доступа!');
                return;
            }
            if (!text) {
                logAction('❌ ОШИБКА: Поле расписания пустое!');
                return;
            }

            logAction('✔ Данные успешно сохранены в локальный сектор терминала!');
        }
    </script>
</body>
</html>
