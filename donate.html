<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка меценатов PashaShineHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
        :root {
            --bg-deep: #050507;
            --bg-card: #101014;
            --accent-primary: #9146FF;
            --accent-bright: #bf94ff;
            --danger-primary: #ff334b;
            --text-main: #e0e0e0;
            --text-muted: #9090a0;
            --border-color: #502099;
            --border-hover: #9146FF;
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image: linear-gradient(rgba(5, 5, 8, 0.88), rgba(3, 3, 5, 0.95)), 
                                url('https://abrakadabra.fun/uploads/posts/2022-02/1645669006_1-abrakadabra-fun-p-fon-dlya-doneishen-alerts-2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', 'Segoe UI', Tahoma, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        a {
            color: var(--accent-bright);
            text-decoration: none;
            transition: var(--transition);
        }
        a:hover {
            color: #fff;
        }

        /* --- Верхняя навигация --- */
        .top-navbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            background-color: #101014;
            border-bottom: 1px solid #502099;
            padding: 15px 20px;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.3);
            width: 100%;
            box-sizing: border-box;
            z-index: 1000;
        }

        .nav-btn {
            background: #181820;
            border: 1px solid #502099;
            color: #bf94ff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 0.9em;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: var(--transition);
            text-align: center;
        }

        .nav-btn:hover, .nav-btn.active {
            background: #9146FF;
            color: #fff;
            border-color: #9146FF;
            box-shadow: 0 0 10px rgba(145, 70, 255, 0.5);
        }

            max-width: 900px;
            width: 100%;

            padding: 0 15px;
