<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поддержка проекта // PashaShineHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030305;
            --bg-card: rgba(16, 14, 23, 0.75);
            --bg-card-hover: rgba(24, 20, 35, 0.9);
            --accent-primary: #9146FF;
            --accent-glow: rgba(145, 70, 255, 0.35);
            --accent-bright: #b882ff;
            --danger-primary: #ff334b;
            --danger-glow: rgba(255, 51, 75, 0.4);
            --text-main: #f3f0ff;
            --text-muted: #9c94b0;
            --border-color: rgba(145, 70, 255, 0.2);
            --border-hover: rgba(145, 70, 255, 0.6);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-deep);
            background-image: url('https://abrakadabra.fun/uploads/posts/2022-02/1645669006_1-abrakadabra-fun-p-fon-dlya-doneishen-alerts-2.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Затемнение фона для читаемости */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 30%, rgba(5, 5, 8, 0.85) 0%, rgba(3, 3, 5, 0.96) 100%);
            z-index: -1;
            pointer-events: none;
        }

        /* Анимированные неоновые сферы */
        .bg-glow-orb {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.15;
            pointer-events: none;
            z-index: -1;
            animation: floatOrb 12s infinite alternate ease-in-out;
        }

        .orb-1 { background: var(--accent-primary); top: -100px; left: -100px; }
        .orb-2 { background: var(--danger-primary); bottom: -100px; right: -100px; animation-delay: -6s; }

        @keyframes floatOrb {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(40px, 40px) scale(1.1); }
        }

        a {
            color: var(--accent-bright);
            text-decoration: none;
            transition: var(--transition);
        }
        a:hover {
            color: #ffffff;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
            padding: 20px;
            width: 100%;
        }

        /* Верхняя навигация */
        .top-navbar {
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(8, 7, 12, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 20px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(145, 70, 255, 0.1);
            gap: 12px;
            flex-wrap: wrap;
        }

        .nav-btn {
            background: rgba(24, 20, 32, 0.6);
            border: 1px solid var(--border-color);
            color: #d1b8ff;
            padding: 10px 18px;
            font-size: 0.85em;
            font-weight: 700;
