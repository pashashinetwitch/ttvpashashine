<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invasion Archive | PashaShineHouse</title>
    <style>
        /* --- Базовые стили и фон --- */
        body {
            background-color: #050507;
            background-image: linear-gradient(rgba(5, 5, 7, 0.82), rgba(5, 5, 7, 0.90)), url('https://butwhytho.net/wp-content/uploads/2025/10/Invasion-Mode-The-Outlast-Trials-But-Why-Tho.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        a {
            color: #ff3333;
            text-decoration: none;
        }
        a:hover {
            color: #ff6666;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            font-size: 0.9em;
            color: #9090a0;
            transition: color 0.2s;
        }
        .back-link:hover {
            color: #ff3333;
        }

        /* --- Неоново-красные блоки --- */
        .cyber-block {
            background-color: #12080a;
            border: 1px solid #992020;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.3),
                        inset 0 0 10px rgba(255, 51, 51, 0.1);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .cyber-block h1 {
            color: #ff4444;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.4em;
            text-align: center;
            border-bottom: 1px solid #661919;
            padding-bottom: 12px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        }

        /* --- Сетка галереи --- */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .gallery-card {
            background: #1a0b0d;
            border: 1px solid #701a1a;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.15);
        }

        .gallery-card:hover {
            border-color: #ff3333;
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 51, 51, 0.5),
                        inset 0 0 8px rgba(255, 51, 51, 0.3);
        }

        .image-thumb-wrap {
            width: 100%;
            height: 160px;
            overflow: hidden;
            background: #080304;
            position: relative;
        }

        .image-thumb-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.08);
        }

        /* Инфо блок на превью */
        .card-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: linear-gradient(to bottom, #160a0c, #100507);
        }

        .card-title {
            font-size: 0.95em;
            color: #ff3333;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 51, 51, 0.7);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .card-subtitle {
            font-size: 0.8em;
            color: #ff6666;
            text-shadow: 0 0 5px rgba(255, 102, 102, 0.5);
        }

        /* --- Модальное окно --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(3, 1, 2, 0.92);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 20px;
            box-sizing: border-box;
        }

        .modal-content-box {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: modalAppear 0.3s ease;
        }

        @keyframes modalAppear {
            from { transform: scale(0.92); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-close-btn {
            position: absolute;
            top: -45px;
            right: 0;
            background: none;
            border: none;
            color: #ff3333;
            font-size: 2.2em;
            cursor: pointer;
            z-index: 10;
            line-height: 1;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.8);
            transition: color 0.2s;
        }
        .modal-close-btn:hover {
            color: #fff;
        }

        .modal-content-box img {
            max-width: 100%;
            max-height: 85vh;
            object-fit: contain;
            border-radius: 6px;
            border: 2px solid #ff3333;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.6);
            background: #000;
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-link">← Вернуться на главную хаба</a>

        <div class="cyber-block">
            <h1>🔪 Архив Испытаний (Invasion)</h1>
            
            <!-- Сетка галереи -->
            <div class="gallery-grid">
                
                <!-- Карточка 1 (Твоя рабочая) -->
                <div class="gallery-card" onclick="openGalleryModal('https://i.ibb.co/35YS0qNv/20.jpg')">
                    <div class="image-thumb-wrap">
                        <img src="https://i.ibb.co/YFMn1kBj/20.jpg" alt="Превью испытания">
                    </div>
                    <div class="card-info">
                        <span class="card-title">🔪 PashaShine (ExPop)</span>
                        <span class="card-subtitle">🔪 Петрушевый чай (ExPop)</span>
                    </div>
                </div>

                <!-- Карточка 2 (Заготовка) -->
                <div class="gallery-card" onclick="openGalleryModal('ССЫЛКА_НА_БОЛЬШУЮ_КАРТИНКУ.png')">
                    <div class="image-thumb-wrap">
                        <img src="ССЫЛКА_НА_ПРЕВЬЮ.png" alt="Превью испытания">
                    </div>
                    <div class="card-info">
                        <span class="card-title">🔪 PashaShine (ExPop)</span>
                        <span class="card-subtitle">🔪 Петрушевый чай (ExPop)</span>
                    </div>
                </div>

                <!-- Карточка 3 (Заготовка) -->
                <div class="gallery-card" onclick="openGalleryModal('ССЫЛКА_НА_БОЛЬШУЮ_КАРТИНКУ.png')">
                    <div class="image-thumb-wrap">
                        <img src="ССЫЛКА_НА_ПРЕВЬЮ.png" alt="Превью испытания">
                    </div>
                    <div class="card-info">
                        <span class="card-title">🔪 PashaShine (ExPop)</span>
                        <span class="card-subtitle">🔪 Петрушевый чай (ExPop)</span>
                    </div>
                </div>

                <!-- Карточка 4 (Заготовка) -->
                <div class="gallery-card" onclick="openGalleryModal('ССЫЛКА_НА_БОЛЬШУЮ_КАРТИНКУ.png')">
                    <div class="image-thumb-wrap">
                        <img src="ССЫЛКА_НА_ПРЕВЬЮ.png" alt="Превью испытания">
                    </div>
                    <div class="card-info">
                        <span class="card-title">🔪 PashaShine (ExPop)</span>
                        <span class="card-subtitle">🔪 Петрушевый чай (ExPop)</span>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="galleryModal" class="modal-overlay" onclick="closeOnBg(event)">
        <div class="modal-content-box">
            <button class="modal-close-btn" onclick="closeGalleryModal()">×</button>
            <img id="modalFullImg" src="" alt="Полноразмерное изображение">
        </div>
    </div>

    <!-- Скрипты -->
    <script>
        function openGalleryModal(imgSrc) {
            const modal = document.getElementById('galleryModal');
            const modalImg = document.getElementById('modalFullImg');
            if (modal && modalImg) {
                modalImg.src = imgSrc;
                modal.style.display = 'flex';
            }
        }

        function closeGalleryModal() {
            document.getElementById('galleryModal').style.display = 'none';
        }

        function closeOnBg(event) {
            if (event.target.id === 'galleryModal') {
                closeGalleryModal();
            }
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeGalleryModal();
            }
        });
    </script>
</body>
</html>
