<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь и запросы</title>
    <style>
        :root {
            --bg-color: #050507;
            --card-bg: #101014;
            --text-color: #e0e0e0;
            --text-muted: #9090a0;
            --accent-color: #9146FF;
            --border-color: #40197a;
            --tag-new-bg: rgba(145, 70, 255, 0.15);
            --tag-new-text: #bf94ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }

        .support-container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.3);
        }

        .support-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab {
            font-size: 13px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 4px;
            background: rgba(145, 70, 255, 0.1);
            color: var(--text-muted);
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tab.active {
            background: var(--accent-color);
            color: #ffffff;
        }

        .support-notice {
            background: rgba(145, 70, 255, 0.05);
            border-left: 3px solid var(--accent-color);
            padding: 12px 15px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            border-radius: 0 4px 4px 0;
        }

        .support-form label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #c39bff;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .support-form input[type="text"],
        .support-form textarea {
            width: 100%;
            background: #050507;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            padding: 10px;
            color: var(--text-color);
            font-family: inherit;
            font-size: 13px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .editor-toolbar {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }

        .editor-toolbar button {
            background: #181820;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 8px;
            font-size: 11px;
            border-radius: 3px;
            cursor: pointer;
        }

        .editor-toolbar button:hover {
            background: var(--accent-color);
        }

        .submit-btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            font-weight: 600;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .support-users-list {
            margin-top: 30px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .user-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-name {
            font-weight: 600;
            color: #bf94ff;
        }

        .status-online {
            color: #00ff66;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="support-container">
    <div class="support-tabs">
        <span class="tab active">Помощь Администрации</span>
        <span class="tab"><a href="invasion.html" class="nav-btn">Патчи игры</a></span> 
        <span class="tab"><a href="donors.html" class="nav-btn">Патчи игры</a></span>
    </div>
    
    <div class="support-notice">
        При отправке сообщения, будьте добры, указывайте подробную информацию — это позволит нам быстрее решить проблему. Важно! Заголовок запроса доступен всем, сообщение и ответ только Вам и Администрации.
    </div>

    <form class="support-form">
        <label>Заголовок:</label>
        <input type="text" placeholder="Введите тему запроса..." required>

        <label>Сообщение:</label>
        <textarea rows="5" placeholder="Опишите суть вопроса..." required></textarea>

        <button type="submit" class="submit-btn">Отправить сообщение</button>
    </form>

    <div class="support-users-list">
        <div class="user-row">
            <span class="user-name online">PashaShine</span>
            <span class="status-online">✉ ОнЛайн</span>
        </div>
        <div class="user-row">
            <span class="user-name online">Wormix54</span>
            <span class="status-online">✉ ОнЛайн</span>
        </div>
    </div>
</div>

</body>
</html>
