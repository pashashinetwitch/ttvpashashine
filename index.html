<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PashaShine | Live Hub</title>
    <style>
        /* --- Базовые стили --- */
        body {
            background-color: #050507;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        a {
            color: #bf94ff;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
            color: #ffffff;
        }

        /* --- Неоновые блоки --- */
        .cyber-block {
            background-color: #101014;
            border: 1px solid #502099;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.4),
                        inset 0 0 10px rgba(145, 70, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .cyber-block h2 {
            color: #c39bff;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 1.1em;
            text-align: center;
            border-bottom: 1px solid #40197a;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        
        .cyber-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .cyber-list li {
            margin-bottom: 8px;
            padding-left: 15px;
            position: relative;
        }
        .cyber-list li::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background-color: #9146FF;
            border-radius: 50%;
            box-shadow: 0 0 10px #9146FF;
        }

        /* --- Структура (3 колонки) --- */
        .sidebar-left {
            width: 260px;
            padding: 15px;
            box-sizing: border-box;
            overflow-y: auto;
            flex-shrink: 0;
        }
        
        .main-content {
            flex-grow: 1;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .sidebar-right {
            width: 320px;
            padding: 15px;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
        }
        
        .welcome-box {
            text-align: center;
        }
        
        .avatar-placeholder {
            width: 90px;
            height: 90px;
            background: #181820;
            border: 2px solid #9146FF;
            border-radius: 50%;
            margin: 0 auto 15px auto;
            box-shadow: 0 0 20px rgba(145, 70, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #9146FF;
            font-size: 2em;
            font-weight: bold;
        }

        /* Плеер и чат на весь экран по высоте */
        .player-container {
            flex-grow: 1;
            background: #000;
            border-radius: 10px;
            border: 1px solid #502099;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.4);
            overflow: hidden;
            margin-bottom: 15px;
        }
        
        .player-container iframe,
        .chat-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .chat-container {
            flex-grow: 1;
            background: #0e0e10;
            border-radius: 10px;
            border: 1px solid #502099;
            box-shadow: 0 0 15px rgba(145, 70, 255, 0.4);
            overflow: hidden;
        }

        .status-box {
            margin-bottom: 0;
            text-align: center;
            padding: 12px;
        }

        /* Мобильная адаптивность */
        @media (max-width: 1000px) {
            body {
                flex-direction: column;
                overflow: auto;
                height: auto;
            }
            .sidebar-left, .sidebar-right {
                width: 100%;
                height: auto;
            }
            .main-content {
                height: 60vh;
            }
            .chat-container {
                height: 400px;
            }
        }
    </style>
</head>
<body>

    <!-- ЛЕВАЯ КОЛОНКА: Навигация -->
    <aside class="sidebar-left">
        <div class="cyber-block welcome-box">
            <div class="avatar-placeholder">P</div>
            <h1 style="font-size: 1.3em; margin: 0 0 5px 0; color: #fff;">PashaShine</h1>
            <p style="margin: 0 0 15px 0; font-size: 0.9em; color: #a0a0b0;">Twitch Streamer</p>
            <a class="cyber-list" href="https://www.twitch.tv/pashashine" target="_blank" style="font-weight: bold;">Открыть на Twitch ↗</a>
        </div>

        <div class="cyber-block">
            <h2>Навигация</h2>
            <ul class="cyber-list">
                <li><a href="https://www.twitch.tv/pashashine/schedule" target="_blank">Расписание</a></li>
                <li><a href="https://www.twitch.tv/pashashine/about" target="_blank">О себе / Железо</a></li>
                <li><a href="https://www.twitch.tv/pashashine/chat" target="_blank">Правила чата</a></li>
            </ul>
        </div>
    </aside>

    <!-- ЦЕНТР: Плеер Twitch -->
    <main class="main-content">
        <div class="player-container">
            <!-- Встроенный плеер Twitch с твоим ником pashashine -->
            <iframe src="https://player.twitch.tv/?channel=pashashine&parent=pashashinetwitch.github.io&muted=false" 
                    allowfullscreen="true">
            </iframe>
        </div>
        
        <div class="cyber-block status-box">
            <p style="margin: 0; color: #fff; font-size: 0.95em;">🔴 Добро пожаловать на стрим!</p>
        </div>
    </main>

    <!-- ПРАВАЯ КОЛОНКА: Чат Twitch -->
    <aside class="sidebar-right">
        <div class="chat-container">
            <!-- Встроенный чат Twitch -->
            <iframe src="https://www.twitch.tv/embed/pashashine/chat?parent=pashashinetwitch.github.io&darkpopout">
            </iframe>
        </div>
    </aside>

</body>
</html>
